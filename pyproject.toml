[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timeleft"
version = "0.1.0"
description = "See how much of the day, week, month, quarter or year is left."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bekka" }]
keywords = ["cli", "time", "progress", "productivity"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
timeleft = "timeleft.cli:main"

[tool.setuptools]
packages = ["timeleft"]
